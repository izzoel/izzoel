name: Update Contribution Forest

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/contribution-forest*.mjs
      - .github/workflows/contribution-forest.yml

permissions:
  contents: write

concurrency:
  group: contribution-forest
  cancel-in-progress: false

jobs:
  forest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test renderer
        run: node --test scripts/contribution-forest.test.mjs
      - name: Generate contribution forest
        run: node scripts/contribution-forest.mjs
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || github.token }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
      - name: Publish SVG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add contribution-forest.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'forest: update contribution calendar [skip ci]'
          # Rebase if the stats workflow updated its own SVGs in the meantime.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
